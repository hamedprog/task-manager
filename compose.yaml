services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://taskmanager:taskmanager@postgres:5432/taskmanager?sslmode=disable
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    container_name: swagger-ui
    environment:
      SWAGGER_JSON: /openapi.yaml
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        [
          "CMD",
          "/wget",
          "--no-verbose",
          "--spider",
          "--tries=1",
          "http://swagger-ui:7007/swagger",
        ]
      timeout: 5s
    image: swaggerapi/swagger-ui
    labels:
      namespace: swagger-ui
    ports:
      - "8080:8080"
    restart: no
    volumes:
      - ./api/openapi.yaml:/openapi.yaml:ro


  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
