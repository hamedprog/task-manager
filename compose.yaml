services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://taskmanager:taskmanager@postgres:5432/taskmanager?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      REDIS_ADDR: redis:6379
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otelcol:
        condition: service_started

  redis:
    command:
      - --loglevel warning
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    image: redis:7-alpine
    labels:
      namespace: redis
    ports:
      - "6379:6379"
    restart: "no"

  otelcol:
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    container_name: otelcol
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    expose:
      - 4317 # OTLP gRPC receiver
      - 4318 # OTLP http receiver
    image: otel/opentelemetry-collector-contrib:0.120.0
    labels:
      namespace: otelcol
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: "no"
    volumes:
      - ./otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    container_name: prometheus
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --spider --tries=1 http://prometheus:9090/metrics || exit 1",
        ]
      timeout: 5s
    image: prom/prometheus:v3.1.0
    labels:
      namespace: prometheus
    ports:
      - "9091:9090"
    restart: "no"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  jaeger:
    container_name: jeager
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://jaeger:14269 || exit 1",
        ]
      timeout: 5s
    image: jaegertracing/all-in-one:1.57.0
    labels:
      namespace: jaeger
    restart: "no"
    ports:
      - "16686:16686"

  swagger:
    container_name: swagger-ui
    environment:
      SWAGGER_JSON: /openapi.yaml
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        [
          "CMD",
          "/wget",
          "--no-verbose",
          "--spider",
          "--tries=1",
          "http://swagger-ui:7007/swagger",
        ]
      timeout: 5s
    image: swaggerapi/swagger-ui
    labels:
      namespace: swagger-ui
    ports:
      - "8080:8080"
    restart: no
    volumes:
      - ./api/openapi.yaml:/openapi.yaml:ro


  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-migrate:
    command:
      - psql
      - --host=postgres
      - --port=5432
      - --username=taskmanager
      - --dbname=taskmanager
      - --file=/init_schema.up.sql
      - --set=ON_ERROR_STOP=1
    container_name: postgres-migrate
    depends_on:
      postgres:
        condition: service_healthy
    image: postgres:17
    labels:
      namespace: postgres-migrate
    restart: "no"
    volumes:
      - ./db/init_schema.up.sql:/init_schema.up.sql:ro
    environment:
      PGPASSWORD: "taskmanager"

volumes:
  postgres_data:
  prometheus_data:
